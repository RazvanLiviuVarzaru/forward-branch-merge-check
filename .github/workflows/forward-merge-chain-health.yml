name: Reusable forward merge chain health

on:
  workflow_call:
    inputs:
      tool_repository:
        description: Repository that contains the forward-merge-check tool.
        required: true
        type: string
      tool_ref:
        description: Ref to checkout from the tool repository.
        required: false
        type: string
        default: main
      config_path:
        description: Branch-chain config path inside the tool repository.
        required: false
        type: string
        default: .github/forward-merge-check/forward-merge-chain.yml
      state_variable_name:
        description: Repository variable used to store previous chain state.
        required: false
        type: string
        default: FORWARD_MERGE_CHAIN_STATE
    secrets:
      tool_repository_token:
        description: Optional token for checking out a private tool repository.
        required: false
      slack_webhook_url:
        description: Optional Slack incoming webhook URL.
        required: false
      zulip_webhook_url:
        description: Optional Zulip incoming webhook URL.
        required: false

permissions:
  contents: read
  actions: write

jobs:
  chain-health:
    runs-on: ubuntu-latest
    name: Check global forward merge chain

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout forward-merge-check tool
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ inputs.tool_ref }}
          path: tool
          token: ${{ secrets.tool_repository_token || github.token }}

      - name: Fetch branch chain
        run: |
          python3 tool/.github/forward-merge-check/scripts/check_forward_mergeability.py \
            --config-file "tool/${{ inputs.config_path }}" \
            --print-branches |
          while IFS= read -r branch; do
            git -C target fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          done

      - name: Test branch chain
        id: chain
        continue-on-error: true
        env:
          FORWARD_MERGE_CHAIN_STATE: ${{ vars[inputs.state_variable_name] }}
        run: |
          python3 tool/.github/forward-merge-check/scripts/check_forward_mergeability.py \
            --repo target \
            --mode chain-health \
            --config-file "tool/${{ inputs.config_path }}" \
            --state-output forward-merge-state.json \
            --notification-output forward-merge-notification.json

      - name: Send state-change notifications
        if: steps.chain.outputs.should_notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          ZULIP_WEBHOOK_URL: ${{ secrets.zulip_webhook_url }}
        run: |
          python3 tool/.github/forward-merge-check/scripts/send_chain_notification.py \
            --notification forward-merge-notification.json \
            --config-file "tool/${{ inputs.config_path }}"

      - name: Store latest chain state
        if: always() && hashFiles('forward-merge-state.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tool/.github/forward-merge-check/scripts/update_github_variable.py \
            --name "${{ inputs.state_variable_name }}" \
            --value-file forward-merge-state.json

      - name: Fail workflow when chain is blocked
        if: steps.chain.outcome == 'failure'
        run: exit 1
